# Railway — NestJS API (@calace/api)
#
# Dashboard settings (required):
#   Source repo: CalAce-Dev/renewal-cna-school
#   Branch: main
#   Root Directory: leave EMPTY (must be repo root — not apps/api)
#
# Variables (required for a healthy run):
#   NODE_ENV=production
#   DATABASE_URL, DIRECT_URL
#   JWT_ACCESS_SECRET
#   WEB_URL, API_CORS_ORIGIN  (your Vercel URL)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[deploy]
# CMD in Dockerfile.api already starts the API; no override needed.
# Healthcheck waits until Nest is up (needs DATABASE_URL etc. set first).
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
