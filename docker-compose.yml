services:
  postgres:
    image: postgres:16-alpine
    container_name: calace-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calace_dev}
      POSTGRES_DB: ${POSTGRES_DB:-calace_lms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-calace} -d ${POSTGRES_DB:-calace_lms}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
